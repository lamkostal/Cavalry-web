<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cavalry Save Image Demo</title>
		<link rel="stylesheet" href="../shared.css" />
		<link rel="stylesheet" href="../cavalry-player.css" />
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1><a href="../">Demos</a> / Save Image Demo</h1>
				<p class="subtitle">Exporting full resolution stills</p>
			</div>

			<div id="player">
				<div id="loading">
					<div class="loading-spinner"></div>
					Loading Cavalry Player...
				</div>
			</div>

			<form id="saveImage" class="info">
				<label>Export Settings</label>
				<select name="type">
					<option value="png">PNG (Lossless)</option>
					<option value="jpeg">JPEG (Compressed)</option>
				</select>
				<button type="submit">Save Image</button>
			</form>

			<div class="about-section">
				<h3>About this Demo</h3>
				<p>
					This demo shows how to export full-resolution still images from a
					Cavalry scene. Customise the appearance by changing colors and random
					seed values, then export at the Composition resolution.
				</p>
			</div>
		</div>

		<script src="app.js" type="module"></script>
	</body>
</html>
